services:
  - type: web
    name: ai-stock-hunter-vn
    runtime: node
    plan: free
    region: singapore
    buildCommand: node -v && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DATA_MODE
        value: demo
      - key: SNAPSHOT_FILE
        value: data/snapshot.json
      - key: STATE_FILE
        value: data/state.json
      - key: CALENDAR_VERIFIED
        value: "false"
      - key: FEES_VERIFIED
        value: "false"
      - key: REVERSAL_ENABLED
        value: "false"
      - key: STRATEGIES_APPROVED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: MARKET_DATA_URL
        sync: false
      - key: MARKET_DATA_TOKEN
        sync: false
      - key: QUOTE_URL
        sync: false
